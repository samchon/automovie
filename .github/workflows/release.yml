name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
      - '!v*\+*'
  workflow_dispatch:
    inputs:
      tag:
        description: "prerelease npm dist-tag to publish"
        required: true
        type: choice
        options:
          - rc
          - next
      version:
        description: "Exact prerelease version. rc: x.y.z-rc.n, next: x.y.z-next.n"
        required: true

permissions:
  id-token: write
  contents: write

# Publishes serialize: two release runs against one npm account at the same
# moment can reject each other, and a run cancelled mid-publish cannot be
# withdrawn from the registry.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing (OIDC) needs npm 11.5.1+, which Node 24 bundles.
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Validate release context
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-guard.js validate-context
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc
          key: ttsc-release-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Bump versions
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-guard.js bump-if-needed
      - name: Validate bumped versions
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-guard.js validate-package-versions
      - name: Commit bumped versions
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml ":(glob)**/package.json"
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): bump ${NPM_TAG} to ${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      # `package:*` runs `package:prepare` first: it builds every published
      # package and verifies each published entry point exists, and only then
      # starts `pnpm -r publish`, which walks the packages one at a time and
      # ships the prebuilt `lib/` as is (the manifests carry no `prepack`
      # rebuild). A build failure therefore stops the job before anything
      # reaches npm, instead of leaving a half-published version set.
      # `pnpm publish` skips private workspaces.
      - name: Publish to npm
        run: pnpm run "package:${NPM_TAG}" --no-git-checks --provenance

  release:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
