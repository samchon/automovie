name: release

# `pnpm release` (bumpp) bumps every manifest, commits, tags and pushes. A
# stable tag `vX.Y.Z` publishes under `latest`; a prerelease tag
# `vX.Y.Z-<id>.N` publishes under the dist-tag `<id>` (`next` or `rc`).
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

# Publishes serialize: two release runs against one npm account at the same
# moment can reject each other, and a run cancelled mid-publish cannot be
# withdrawn from the registry.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing (OIDC) needs npm 11.5.1+, which Node 24 bundles.
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/ttsc
          key: ttsc-release-${{ hashFiles('pnpm-lock.yaml') }}
      # `package:*` builds every package first and only then starts
      # `pnpm -r publish`, which walks the packages one at a time and ships the
      # prebuilt `lib/` as is (the manifests carry no `prepack` rebuild). A
      # build failure therefore stops the job before anything reaches npm,
      # instead of leaving a half-published version set. `pnpm publish` skips
      # private workspaces.
      - name: Publish to npm
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) channel="${version#*-}"; channel="${channel%%.*}" ;;
            *) channel=latest ;;
          esac
          pnpm run "package:${channel}" --no-git-checks --provenance

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
