name: website

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "website/**"
      # The site bundles these packages from source, so a change to one of
      # them is built into the site in the pull request that makes it.
      - "packages/archetypes/**"
      - "packages/engine/**"
      - "packages/human/**"
      - "packages/ingest/**"
      - "packages/interface/**"
      - "packages/motions/**"
      - "packages/render/**"
      - "packages/viewer/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "website/**"
      - "packages/archetypes/**"
      - "packages/engine/**"
      - "packages/human/**"
      - "packages/ingest/**"
      - "packages/interface/**"
      - "packages/motions/**"
      - "packages/render/**"
      - "packages/viewer/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The scenes' takes are computed with the packages before the site is
  # built: a sixth of the takes per runner, each runner baking its part in a
  # process per core, because one machine would take longer than the job's
  # limit. Each runner keeps its takes in a cache keyed by everything a take
  # is computed from, so a change elsewhere bakes nothing again.
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/baked
          key: bake-${{ matrix.shard }}-${{ hashFiles('packages/archetypes/src/**', 'packages/engine/src/**', 'packages/human/src/**', 'packages/interface/src/**', 'packages/motions/src/**', 'packages/render/src/**', 'website/src/scenes/**', 'website/src/playground/**', 'website/build/bake.ts', 'pnpm-lock.yaml') }}
          restore-keys: bake-${{ matrix.shard }}-
      - name: Bake this share of the scenes
        run: pnpm --filter @automovie/website run bake --runner ${{ matrix.shard }} --runners 6
      # A take is written as soon as it is baked, so the takes of a share that
      # refused one are kept for the next run, which bakes only the rest.
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/baked
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baked-${{ matrix.shard }}
          path: website/public/baked
          retention-days: 1

  deploy:
    needs: bake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # The site is a workspace member, so one root install links the packages
      # it imports. Their `exports` point at TypeScript source, which Next
      # compiles with the site, so no package is built first.
      - run: pnpm install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-website-${{ hashFiles('pnpm-lock.yaml') }}

      # The shares' takes are joined into one manifest; the build's own bake
      # then finds every take unchanged.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baked-*
          path: website/public/baked
          merge-multiple: true
      - name: Join the baked shares
        run: pnpm --filter @automovie/website run bake --merge

      - name: Type check
        run: pnpm --filter @automovie/website typecheck

      - name: Test
        run: pnpm --filter @automovie/website test

      - name: Build website
        run: pnpm --filter @automovie/website build

      # The built pages are opened in a headless browser, because only the
      # browser bundle shows a package source the bundler compiled wrongly.
      - name: Install the headless browser
        run: pnpm --filter @automovie/website exec playwright-core install --with-deps chromium-headless-shell

      - name: Smoke test
        run: pnpm --filter @automovie/website smoke

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: website/out
          # keep gh-pages at one commit: every deploy overwrites the branch
          # instead of adding to a history
          single-commit: true