name: website

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "website/**"
      # The site bundles these packages from source, so a change to one of
      # them is built into the site in the pull request that makes it.
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "website/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # The site is a workspace member, so one root install links the packages
      # it imports. Their `exports` point at TypeScript source, which Next
      # compiles with the site, so no package is built first.
      - run: pnpm install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-website-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Type check
        run: pnpm --filter @automovie/website typecheck

      - name: Prepare website export
        run: pnpm --filter @automovie/website build:preflight

      - name: Restore verified gallery results
        id: gallery-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.bake-cache/results
          key: website-bake-v2-${{ hashFiles('packages/*/src/**', 'website/src/**', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            website-bake-v2-${{ hashFiles('packages/*/src/**', 'website/src/**', 'pnpm-lock.yaml') }}-
            website-bake-v2-

      # The queue stops inside this backstop so the save step still runs after
      # a failed take. The cache contains only parent-promoted results.
      - name: Bake gallery
        id: bake
        timeout-minutes: 40
        run: pnpm --filter @automovie/website bake --jobs 3

      - name: Save retained gallery results
        if: ${{ !cancelled() && (steps.bake.outcome == 'success' || steps.bake.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.bake-cache/results
          key: ${{ steps.gallery-cache.outputs.cache-primary-key }}

      - name: Export website
        timeout-minutes: 15
        run: pnpm --filter @automovie/website build:export

      # The built pages are opened in a headless browser, because only the
      # browser bundle shows a package source the bundler compiled wrongly,
      # and only the browser computes a scene's take.
      - name: Install the headless browser
        run: pnpm --filter @automovie/website exec playwright-core install --with-deps chromium-headless-shell

      - name: Smoke test
        run: pnpm --filter @automovie/website smoke

      # Plays every take of the everyday, work and passenger scenes in Node and
      # checks their displayed contacts. It needs no build, so it reports even
      # when the build or the smoke test fails.
      - name: Scene checks
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: pnpm --filter @automovie/website scenes

      - name: Deploy
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: website/out
          # keep gh-pages at one commit: every deploy overwrites the branch
          # instead of adding to a history
          single-commit: true
