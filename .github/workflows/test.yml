name: test
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite runs in parallel shards, split by scenario name so that each
  # takes a comparable share of the run's time.
  shard:
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: motion
            select: --include test_human_motion_ --exclude law_sweep lexicon test_human_motion_core_flight_sample
          - name: sweep-posture
            select: --include law_sweep_posture
          - name: sweep-touch
            select: --include law_sweep_touch
          - name: lexicon
            select: --include test_human_motion_lexicon
          - name: other
            select: --exclude test_human_motion_
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-test-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm test ${{ matrix.shard.select }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      # The plugin-transformed program stalls inside this one scenario on
      # CI while it passes untransformed; it runs without the ttsc plugins
      # and without the second type check until that is resolved.
      - if: matrix.shard.name == 'other'
        run: pnpm --filter @automovie/test exec ttsx --no-plugins --noCheck src/index.ts --include test_human_motion_core_flight_sample
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - if: matrix.shard.name == 'other'
        name: Lexicon schemas are current (regenerate the schemas with `pnpm --filter @automovie/motions schemas` and commit them)
        run: |
          pnpm --filter @automovie/motions schemas
          git diff --exit-code -- packages/motions/src/lexicon/HUMAN_LEXICON_SCHEMA_DATA.ts

  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = "success"
