packages:
  - config
  - packages/*
  - test
  - website

catalogs:
  samchon:
    typia: &typia ^15.4.1
    "@nestia/e2e": ^14.3.1
    "@wrtnlabs/evidence": ^0.11.1
    tstl: ^3.0.0
    ttsc: &ttsc ^0.37.1
    "@ttsc/evidence": *ttsc
    "@ttsc/lint": *ttsc
    "@ttsc/unplugin": *ttsc
  typescript:
    typescript: ^7.0.2
    "@trivago/prettier-plugin-sort-imports": ^5.2.2
    prettier: ^3.5.3
    prettier-plugin-jsdoc: ^1.8.1
  three:
    three: &three ^0.186.0
    "@types/three": *three
  gltf:
    "@gltf-transform/core": ^4.5.0
    "@gltf-transform/extensions": ^4.5.0
  react:
    react: &react ^19.2.0
    react-dom: *react
    "@types/react": &react-types ^19.2.0
    "@types/react-dom": *react-types
  rolldown:
    rolldown: ^1.1.5
  vite:
    vite: ^5.4.10
    esbuild: ^0.21.5
  media:
    "@playwright/mcp": 0.0.84
    fflate: ^0.8.3
    "@huggingface/transformers": ^3.8.1
    gifenc: ^1.0.3
    h264-mp4-encoder: ^1.0.12
    mp4box: ^2.4.1
    onnxruntime-node: 1.21.0
    playwright: ^1.60.0
    playwright-core: ^1.60.0
    pngjs: ^7.0.0
    "@types/pngjs": ^6.0.5
    ffmpeg-static: ^5.2.0
  utils:
    "@types/node": ^22.19.17
    bumpp: ^12.3.0
    c8: ^10.1.3
    chalk: 4.1.2
    rimraf: ^6.0.1
    tinyglobby: ^0.2.17
# Nextra 4.6 validates its layout's props after taking `children` out of them,
# which zod 4.1 accepts and later zod 4 releases refuse as a missing key.
overrides:
  "nextra>zod": 4.1.12
  "nextra-theme-docs>zod": 4.1.12
allowBuilds:
  esbuild: true
  ffmpeg-static: true
  koffi: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  - "@nestia/e2e@14.3.1"
  - "@ttsc/darwin-arm64@0.37.1"
  - "@ttsc/darwin-x64@0.37.1"
  - "@ttsc/evidence@0.37.1"
  - "@ttsc/lint@0.37.1"
  - "@ttsc/linux-arm64@0.37.1"
  - "@ttsc/linux-arm@0.37.1"
  - "@ttsc/linux-x64@0.37.1"
  - "@ttsc/unplugin@0.37.1"
  - "@ttsc/win32-arm64@0.37.1"
  - "@ttsc/win32-x64@0.37.1"
  - "@typia/interface@15.4.1"
  - "@typia/utils@15.4.1"
  - ttsc@0.37.1
  - typia@15.4.1
  - "@wrtnlabs/evidence@0.11.1"
