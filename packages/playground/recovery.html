<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoMovie recovery inspection</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eef0f3; color: #202936; font: 14px system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
      aside { padding: 18px; background: #fff; overflow: auto; border-right: 1px solid #ccd2db; }
      h1 { font-size: 18px; margin: 0 0 14px; }
      p { line-height: 1.5; }
      button, select, input { margin: 4px 0; padding: 7px; max-width: 100%; }
      label { display: block; margin-top: 12px; }
      button { cursor: pointer; }
      #viewport { min-width: 0; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      output { white-space: pre-wrap; display: block; font-size: 12px; line-height: 1.5; margin-top: 14px; }
    </style>
  </head>
  <body><main id="app"></main><script type="module" src="/src/recovery-view.ts"></script></body>
</html>
