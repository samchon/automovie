<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human 디버그 뷰어</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui; background: #eef1f5; }
      #app { height: 100%; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
      #app.bare { grid-template-columns: minmax(0, 1fr); }
      #app.bare aside, body:has(#app.bare) #compiler { display: none; }
      aside { min-width: 0; min-height: 0; padding: 12px; background: #fff; overflow: auto; }
      fieldset { margin: 8px 0; padding: 6px 8px; border: 1px solid #d5dae1; }
      legend { font-weight: 600; }
      label { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; }
      label input[type="text"], label select { width: 160px; }
      label input[type="number"] { width: 80px; }
      .row { display: inline-flex; align-items: center; gap: 4px; margin: 1px 0; white-space: nowrap; }
      .row input[type="color"] { width: 26px; height: 18px; padding: 0; border: 0; }
      .row input[type="number"] { width: 52px; }
      .row button { padding: 0 4px; font-size: 11px; }
      details { margin: 2px 0; }
      summary { cursor: pointer; }
      #viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      #labels span { position: absolute; transform: translate(-50%, -120%); padding: 1px 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.85); font: 11px ui-monospace, monospace; white-space: nowrap; }
      #notices { position: absolute; left: 8px; top: 8px; right: 8px; z-index: 2; padding: 4px 6px; background: rgba(255, 240, 240, 0.92); color: #b42318; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
      #notices:empty { display: none; }
      #url { width: 100%; box-sizing: border-box; font: 11px ui-monospace, monospace; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px ui-monospace, monospace; max-height: 240px; overflow: auto; }
      #compiler { position: fixed; bottom: 12px; right: 12px; z-index: 3; max-width: 60vw; max-height: 50vh; overflow: auto; background: #fff; border: 1px solid #aab7c8; border-radius: 6px; padding: 6px 10px; font: 12px ui-monospace, monospace; }
      #compiler[data-phase="failed"] summary { color: #a12b24; }
    </style>
  </head>
  <body>
    <main id="app">
      <aside>
        <h1 style="font-size: 16px; margin: 4px 0">Human 디버그 뷰어</h1>
        <input id="url" readonly title="현재 보기의 URL" />
        <button id="capture">PNG 저장</button>
        <div id="controls"></div>
        <pre id="status"></pre>
      </aside>
      <div id="viewport">
        <canvas id="canvas"></canvas>
        <div id="labels"></div>
        <div id="notices" role="alert"></div>
      </div>
    </main>
    <!-- A module graph that fails to fetch or parse (a half-saved file) marks the page, so the capture session retries instead of waiting. -->
    <script type="module" src="/debug/page/human-debug.ts" onerror="window.__humanDebugFailed = 'the page module graph failed to load'; document.getElementById('notices').textContent = window.__humanDebugFailed"></script>
  </body>
</html>
