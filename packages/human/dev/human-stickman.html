<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>automovie: Human 부피와 표정</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f1f3f6;
      }
      #view {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #clips {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(96vw, 1000px);
        font: 13px/1 system-ui, sans-serif;
      }
      #clips button {
        padding: 7px 13px;
        border: 1px solid #c4ccd6;
        border-radius: 999px;
        background: #fff;
        color: #2a3340;
        cursor: pointer;
      }
      #clips button.on {
        background: #2f6fd6;
        border-color: #2f6fd6;
        color: #fff;
      }
      #status {
        position: fixed;
        left: 14px;
        bottom: 12px;
        font: 12px/1.4 system-ui, sans-serif;
        color: #2a3340;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="clips"></div>
    <div id="status"></div>
    <script type="module" src="/src/human-stickman-view.ts"></script>
  </body>
</html>
