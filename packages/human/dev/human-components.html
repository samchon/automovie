<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Human 부위 검사</title><style>
html,body{margin:0;height:100%;font:14px system-ui;background:#eef1f5}#app{height:100%;min-width:0;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}aside{min-width:0;min-height:0;padding:18px;background:white;overflow:auto}label,button,select,input{display:block;margin:10px 0;max-width:100%}canvas{min-width:0;min-height:0;width:100%;height:100%;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:8px}#components label{display:flex;gap:8px}#components input{margin:0}
</style></head><body><main id="app"><aside><h1>Human 부위 검사</h1><p>실제 부위 생성기가 내보낸 열린 메시와 생성 곡선을 검사합니다.</p><input id="file" type="file" accept="application/json"/><div id="components"></div><label>표시<select id="pass"><option value="surface">표면</option><option value="overlay">표면과 생성 곡선</option><option value="construction">생성 곡선</option></select></label><label>방위각 <input id="az" type="number" value="25"/></label><label>고도각 <input id="el" type="number" value="15" min="-90" max="90"/></label><button id="fit">선택 부위 맞춤</button><button id="capture">PNG 저장</button><pre id="status">부위 생성 결과를 선택하세요.</pre></aside><canvas id="canvas"></canvas></main><script type="module" src="/src/human-component-view.ts"></script></body></html>
