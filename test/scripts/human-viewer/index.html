<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human viewer index</title>
<style>
:root{color-scheme:dark;--bg:#1c252e;--panel:#25313c;--line:#3a4956;--text:#e8eef3;--dim:#9fb0be;--accent:#7cc4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0}
input[type=search]{min-width:220px;padding:6px 8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px}
.filters button,.links a{padding:5px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;text-decoration:none;cursor:pointer;font:inherit}
.filters button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#status{margin-left:auto;color:var(--dim)}
main{padding:8px 16px 48px}
section h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card a{color:inherit;text-decoration:none;display:block}
.card a.compare{padding:4px 8px 8px;color:var(--accent);font-size:12px}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card .frame{aspect-ratio:1;background:#151c23;display:grid;place-items:center;color:var(--dim);font-size:12px;padding:4px;text-align:center}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.card img.stale{opacity:.45}
.card span.label{display:block;padding:6px 8px;overflow-wrap:anywhere}
#rejected{margin:12px 16px;padding:8px 12px;background:#4a2a2a;border-radius:4px;display:none;white-space:pre-wrap}
#empty{color:var(--dim);padding:24px 16px;display:none}
@media (max-width:520px){header{padding:8px 16px}#status{margin-left:0}}
</style>
</head><body>
<header>
  <h1>Human viewer</h1>
  <input id="search" type="search" placeholder="Search documents" aria-label="Search documents">
  <span class="filters" role="group" aria-label="Domain">
    <button data-domain="all" aria-pressed="true">All</button>
    <button data-domain="face" aria-pressed="false">Face</button>
    <button data-domain="body" aria-pressed="false">Body</button>
  </span>
  <span class="links"><a href="/parts.html">Part gallery</a></span>
  <span id="status">Loading</span>
</header>
<div id="rejected"></div>
<main id="list"></main>
<p id="empty">No document matches.</p>
<script type="module" src="/index.mts"></script>
</body></html>
