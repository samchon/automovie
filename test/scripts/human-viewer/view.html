<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human development viewer</title>
<style>
:root{color-scheme:dark;--bg:#1c252e;--panel:#25313c;--line:#3a4956;--text:#e8eef3;--dim:#9fb0be;--accent:#7cc4ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .group{display:flex;gap:4px;align-items:center}
button,select,input[type=search]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
button{cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
a{color:var(--accent)}
#doc{max-width:260px}
input[type=range]{width:110px}
output{min-width:3.2em;display:inline-block;color:var(--dim)}
#body{flex:1;display:flex;min-height:0}
#parts{width:230px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#parts header{padding:6px 8px;display:flex;gap:6px;align-items:center}
#parts input[type=search]{flex:1;min-width:0}
#part-list{overflow:auto;flex:1;padding:0 4px 8px}
.part{display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:3px}
.part:hover{background:var(--bg)}
.part span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part label{color:var(--dim);font-size:11px;display:flex;gap:2px;align-items:center}
#part-count{color:var(--dim);padding:0 8px 4px}
#stage{flex:1;position:relative;min-width:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#error{position:absolute;bottom:0;left:0;right:0;z-index:5;background:#641e1e;padding:8px;display:none}
@media (max-width:760px){#body{flex-direction:column}#parts{width:auto;max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head><body>
<div id="banner" hidden style="background:#6b5a1e;padding:6px 12px;cursor:pointer">The source changed. Click to redraw with the same address.</div>
<div id="bar">
  <span class="group"><a href="/">Index</a><a href="/parts.html">Parts</a></span>
  <span class="group"><button id="prev" title="Previous document">Prev</button><select id="doc" aria-label="Document"></select><button id="next" title="Next document">Next</button></span>
  <span class="group" id="views" role="group" aria-label="View"></span>
  <span class="group"><select id="pass" aria-label="Pass"></select></span>
  <span class="group"><label>Pitch <input id="pitch" type="range" min="-89" max="89" step="1"></label><output id="pitch-out"></output></span>
  <span class="group"><label>Zoom <input id="zoom" type="range" min="0.25" max="4" step="0.05"></label><output id="zoom-out"></output></span>
  <span class="group"><select id="size" aria-label="Size"><option>480</option><option>640</option><option>900</option><option>1200</option></select></span>
  <span class="group"><label title="Redraw by itself after 20 quiet seconds"><input id="auto" type="checkbox"> auto</label></span>
  <span class="group"><label><input id="ao" type="checkbox"> AO</label></span>
  <span class="group" id="progress" style="color:var(--accent)"></span>
  <span class="group"><a id="render-link" href="/render" target="_blank">/render</a><button id="copy-render">Copy</button><a id="sheet-link" href="/sheet" target="_blank">/sheet</a><button id="copy-sheet">Copy</button></span>
</div>
<div id="body">
  <aside id="parts">
    <header><input id="part-filter" type="search" placeholder="Filter parts" aria-label="Filter parts"><button id="part-reset" title="Show every part">All</button></header>
    <div id="part-count"></div>
    <div id="part-list"></div>
  </aside>
  <main id="stage"><div id="error"></div></main>
</div>
<script type="module" src="/host.mts"></script>
</body></html>
