<!doctype html>
<!--
  Dependency-free review page for exported face models. `capture-articulation.mjs`
  opens it over file:// with Chromium's file access flag, injects one exported
  model JSON through `window.show(model, options)` and screenshots the canvas.
  A hand-typed red/green marker pair beside the head fixes the reading
  convention: red sits at +X (the subject's anatomical left, which appears on
  the viewer's right in the front view) and green at +Y. The key light is a
  directional lamp from the upper left so planes read; clay swaps every
  material for one untextured grey. Hair-mask mode keeps the same camera and
  geometry but writes visible hair white and everything else black; the hair
  texture's alpha still cuts its fibres before depth testing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Articulation review</title>
    <style>
      body {
        margin: 0;
        background: #202830;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../../../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view" width="900" height="900"></canvas>
    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("view");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(900, 900, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const gl = renderer.getContext();
      const debug = gl.getExtension("WEBGL_debug_renderer_info");
      window.RENDERER = debug
        ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
        : gl.getParameter(gl.RENDERER);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202830);
      const key = new THREE.DirectionalLight(0xffffff, 2.6);
      key.position.set(-1, 1.4, 1.8);
      scene.add(key);
      scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x3a3f46, 0.55));
      const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 10);
      const loader = new THREE.TextureLoader();
      let group = null;
      const markers = new THREE.Group();
      const marker = (color, position) => {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.006, 12, 12),
          new THREE.MeshBasicMaterial({ color }),
        );
        mesh.position.set(...position);
        return mesh;
      };
      markers.add(
        marker(0xff3030, [0.11, 0.03, 0.12]),
        marker(0x30ff30, [0, 0.16, 0.12]),
      );
      scene.add(markers);
      window.show = async (model, options) => {
        if (group !== null) scene.remove(group);
        group = new THREE.Group();
        scene.background.set(options.hairMask === true ? 0x000000 : 0x202830);
        markers.visible = options.hairMask !== true;
        const materials = new Map();
        for (const material of model.materials) {
          const clay = options.clay === true;
          const mat = new THREE.MeshStandardMaterial({
            color: clay
              ? 0xb8b0a4
              : new THREE.Color(
                  material.baseColor.r,
                  material.baseColor.g,
                  material.baseColor.b,
                ),
            roughness: clay ? 0.85 : material.roughness,
            metalness: 0,
            side: THREE.DoubleSide,
          });
          if (!clay && material.texture) {
            const texture = await new Promise((resolve, reject) =>
              loader.load(material.texture, resolve, undefined, reject),
            );
            texture.flipY = false;
            texture.colorSpace = THREE.SRGBColorSpace;
            mat.map = texture;
            mat.transparent = true;
            mat.alphaTest = 0.45;
          }
          materials.set(material.id, mat);
        }
        for (const part of model.parts) {
          if (part.mesh === null) continue;
          if (
            options.only !== undefined &&
            !options.only.some((prefix) => part.id.startsWith(prefix))
          )
            continue;
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(part.mesh.positions, 3),
          );
          if (part.mesh.normals)
            geometry.setAttribute(
              "normal",
              new THREE.Float32BufferAttribute(part.mesh.normals, 3),
            );
          if (part.mesh.uvs)
            geometry.setAttribute(
              "uv",
              new THREE.Float32BufferAttribute(part.mesh.uvs, 2),
            );
          if (part.mesh.indices) geometry.setIndex(part.mesh.indices);
          // Vertex colours (pigmentation, scalp tint) multiply the finish, as
          // they do in the exported glTF; a clay view ignores them.
          let material = materials.get(part.material);
          if (part.mesh.colors && options.clay !== true) {
            geometry.setAttribute(
              "color",
              new THREE.Float32BufferAttribute(part.mesh.colors, 3),
            );
            material = material.clone();
            material.vertexColors = true;
          }
          if (options.hairMask === true) {
            const hair = part.id.startsWith("numerical-hair:");
            const maskMaterial = new THREE.MeshBasicMaterial({
              color: hair ? 0xffffff : 0x000000,
              side: THREE.DoubleSide,
            });
            if (hair && material.map) {
              const source = material.map.image;
              const alphaCanvas = document.createElement("canvas");
              alphaCanvas.width = source.width;
              alphaCanvas.height = source.height;
              const context = alphaCanvas.getContext("2d");
              context.drawImage(source, 0, 0);
              const pixels = context.getImageData(
                0,
                0,
                source.width,
                source.height,
              );
              for (let offset = 0; offset < pixels.data.length; offset += 4)
                pixels.data[offset] =
                  pixels.data[offset + 1] =
                  pixels.data[offset + 2] =
                    255;
              context.putImageData(pixels, 0, 0);
              maskMaterial.map = new THREE.CanvasTexture(alphaCanvas);
              maskMaterial.map.flipY = false;
              maskMaterial.alphaTest = 0.45;
            }
            material = maskMaterial;
          }
          group.add(new THREE.Mesh(geometry, material));
        }
        scene.add(group);
        const target = new THREE.Vector3(...(options.target ?? [0, 0, 0.06]));
        const distance = options.distance ?? 0.62;
        const yaw = ((options.yaw ?? 0) * Math.PI) / 180;
        const pitch = ((options.pitch ?? 0) * Math.PI) / 180;
        camera.position.set(
          target.x + distance * Math.sin(yaw) * Math.cos(pitch),
          target.y + distance * Math.sin(pitch),
          target.z + distance * Math.cos(yaw) * Math.cos(pitch),
        );
        camera.lookAt(target);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        gl.finish();
        return { renderer: window.RENDERER, parts: group.children.length };
      };
    </script>
  </body>
</html>
