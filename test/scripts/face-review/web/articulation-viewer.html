<!doctype html>
<!--
  Review page for exported face models. `capture-articulation.ts` serves it
  through vite, injects one exported model JSON through `window.show(model,
  options)` and screenshots the canvas. The drawing lives in
  `articulationViewer.ts`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Articulation review</title>
    <style>
      body {
        margin: 0;
        background: #202830;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="view" width="900" height="900"></canvas>
    <script type="module" src="./articulationViewer.ts"></script>
  </body>
</html>
