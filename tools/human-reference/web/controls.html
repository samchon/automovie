<style>
#tools {position:fixed;left:10px;bottom:28px;z-index:10;padding:6px;background:#fffffff0;border:1px solid #8c99aa;font:12px sans-serif;max-width:1500px}
#tools label {margin-right:8px} #tools input {width:65px} #tools select {max-width:160px}
#status {padding-left:8px} #stage {cursor:grab}
</style>
<div id="tools">
<div><strong id="panel-mode">원본 vs 엔진 곡선 재생 표면</strong></div>
<label>법선 <select id="normals"><option value="derived">복원 기하 법선</option><option value="flat">양쪽 면 법선</option></select></label><label>단면 표시 간격 <input id="stride" value="5" type="number" min="1"></label>
<label>인물 <select id="gate"></select></label><label>부위 <select id="region"></select></label>
<button id="front">정면</button><button id="back">후면</button><button id="left">좌측</button><button id="right">우측</button>
<button id="high">위 사선</button><button id="low">아래 사선</button><button id="reset">전신 맞춤</button>
<label>방위 <input id="az" type="number" value="0"></label><label>고도 <input id="el" type="number" value="0"></label>
<label>높이 mm <input id="span" type="number" value="0"></label>
<label>중심 X <input id="cx" type="number" value="0"></label><label>Y <input id="cy" type="number" value="850"></label><label>Z <input id="cz" type="number" value="0"></label>
<span id="status">준비 중</span>
</div>
<script type="module">
const $ = id => document.getElementById(id);
while (!window.ready) await new Promise(resolve => requestAnimationFrame(resolve));
const inventory = await (await fetch('/inventory')).json();
for (const gate of inventory.gates) $('gate').add(new Option(gate, gate));
let state = {gate:inventory.gates[0],region:'wholebody',pose:inventory.pose,view:'free',azimuth:0,elevation:0};
let timer; let busy=false; const setBusy=value=>{busy=value;window.uiBusy=value;for(const e of document.querySelectorAll("#tools input,#tools select,#tools button"))e.disabled=value;};
const draw = () => { if(busy)return;
  const numeric=["span","az","el","cx","cy","cz"];if(numeric.some(id=>!Number.isFinite(Number($(id).value))||$(id).value.trim()==="")){ $("status").textContent="카메라 수치가 유효하지 않습니다";return;} const span = +$('span').value;
  const result = window.renderView({...state, azimuth:+$('az').value,elevation:+$('el').value,
    ...(span > 0 ? {span,focus:[+$('cx').value,+$('cy').value,+$('cz').value]} : {}),
    note:'같은 카메라·조명·기하 법선으로 비교합니다. 생성 범위와 미완성 사항은 고정 입력 명세에 기록됩니다.'});
  window.inspection = {...result, ...state};
  $('status').textContent = result.renderer.renderer + ' | ' + result.renderedAt;
};
const load = async () => {
  setBusy(true); $('status').textContent='불러오는 중';
  try {
    state.gate=$('gate').value; state.region=$('region').value || 'wholebody';
    await window.loadMesh(state.gate,state.pose);
    const info=await window.loadLines(state.gate,state.region,state.pose);
    if (!info.lines) throw new Error('표시할 라인이 없습니다');
  } finally { setBusy(false); }
  draw();
};
const populate = async () => {
  const inv=await (await fetch('/inventory/'+$('gate').value)).json();
  $('region').replaceChildren(new Option('전신','wholebody'));
  for(const region of inv.regions) $('region').add(new Option(region,region));
  await load();
};
$('gate').onchange=populate; $('region').onchange=async()=>{$('span').value='0';await load()};
$('normals').onchange=()=>{window.setNormalMode($('normals').value);draw()}; $('stride').onchange=load;
for(const id of ['az','el','span','cx','cy','cz']) $(id).onchange=draw;
for(const [id,az,el] of [['front',0,0],['back',180,0],['left',90,0],['right',270,0],['high',45,45],['low',45,-35]]) $(id).onclick=()=>{$('az').value=az;$('el').value=el;draw()};
$('reset').onclick=()=>{$('span').value='0';draw()};
let pointer=null;
$('stage').onpointerdown=event=>{pointer=[event.clientX,event.clientY,+$('az').value,+$('el').value];$('stage').setPointerCapture(event.pointerId)};
$('stage').onpointermove=event=>{if(!pointer)return;$('az').value=(pointer[2]+(event.clientX-pointer[0])*.3).toFixed(1);$('el').value=Math.max(-89,Math.min(89,pointer[3]+(event.clientY-pointer[1])*.2)).toFixed(1);draw()};
$('stage').onpointerup=()=>pointer=null;
$('stage').onwheel=event=>{event.preventDefault();if(+$('span').value===0){const i=window.inspection;$('cx').value=i.targetMm[0].toFixed(1);$('cy').value=i.targetMm[1].toFixed(1);$('cz').value=i.targetMm[2].toFixed(1);$('span').value=i.heightMm} $('span').value=(+$('span').value*Math.exp(event.deltaY*.001)).toFixed(1);clearTimeout(timer);timer=setTimeout(draw,20)};
window.compareMode=true; await populate();
</script>
